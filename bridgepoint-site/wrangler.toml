name = "bprmain"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public/"
binding = "ASSETS"
# The Worker only runs for form posts and old Wix URLs; everything else is served straight from /public
run_worker_first = ["/api/*", "/jobpostings/*", "/careers", "/job-seekers", "/employers", "/about-us", "/contact", "/blog"]

[[send_email]]
name = "EMAIL"
